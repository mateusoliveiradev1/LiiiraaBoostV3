services:
  - type: web
    name: liiiraa-api-staging
    runtime: image
    plan: free
    region: ohio
    autoDeploy: false
    image:
      url: ghcr.io/mateusoliveiradev1/liiiraa-boost-api@${STAGING_IMAGE_DIGEST}
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: STAGING_IMAGE_DIGEST
        sync: false
      - key: STAGING_DATA_CLASSIFICATION
        value: synthetic
      - key: STAGING_BUILD_ID
        sync: false
      - key: STAGING_INVITATION_ONLY
        value: 'true'
      - key: STAGING_PUBLIC_SIGNUP
        value: 'false'
      - key: STAGING_CHANNEL
        value: internal
