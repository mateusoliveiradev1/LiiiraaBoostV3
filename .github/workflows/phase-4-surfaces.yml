name: Phase 4 isolated staging surfaces

on:
  workflow_dispatch:
    inputs:
      promotion_scope:
        description: Bounded provider preview or owned-domain broader closed beta gate
        required: true
        default: bounded-provider-preview
        type: choice
        options:
          - bounded-provider-preview
          - broader-closed-beta
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - apps/account/**
      - apps/admin/**
      - apps/api/**
      - apps/desktop/**
      - packages/control-plane-adapters/**
      - tooling/web-evidence/**
      - .github/workflows/phase-4-surfaces.yml

permissions:
  contents: read

concurrency:
  group: phase-4-surfaces-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_API_ORIGIN: https://liiiraa-api-staging.onrender.com
  SURFACE_SCOPE: bounded-provider-preview

jobs:
  verify-contracts:
    name: Verify isolated deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Activate exact pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Verify dependency allowlist before installation
        run: node tooling/supply-chain/verify-pins.mjs --check
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify static staging origin contract without local daemons
        run: pnpm --filter @liiiraa/web-evidence exec playwright test tests/security-artifacts.spec.ts --grep @staging-origin-smoke --workers=1
      - name: Verify secure invitation provisioning without secrets
        run: pnpm --filter @liiiraa/api exec vitest --run src/staging/provision-invitations.test.ts

  desktop-internal:
    name: Admit restricted numbered desktop build
    needs: verify-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: desktop-internal
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Activate exact pnpm and install reviewed dependencies
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate && node tooling/supply-chain/verify-pins.mjs --check && pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Internal runtime and immutable channel identity
        run: pnpm --filter @liiiraa/desktop exec vitest --run src/internal-channel.test.ts
      - name: Admit checked-in restricted channel projection
        run: node apps/desktop/scripts/validate-internal-channel.mjs --channel internal --build-id internal-023001 --rollback-build-id internal-023000

  deploy-public:
    name: Deploy isolated public staging project
    if: github.ref == 'refs/heads/main'
    needs: verify-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-public
    permissions:
      contents: read
    outputs:
      origin: ${{ steps.deploy.outputs.origin }}
    steps:
      - name: Request exact public project deployment
        id: deploy
        env:
          EXPECTED_ORIGIN: ${{ vars.PUBLIC_STAGING_ORIGIN }}
          GIT_SHA: ${{ github.sha }}
          PROJECT_ID: ${{ secrets.VERCEL_PUBLIC_PROJECT_ID }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          node --input-type=module --eval "import { appendFileSync } from 'node:fs'; const expected = new URL(process.env.EXPECTED_ORIGIN); if (expected.protocol !== 'https:' || expected.pathname !== '/' || expected.search || expected.hash) throw new Error('Invalid public staging origin'); const response = await fetch('https://api.vercel.com/v13/deployments?teamId=' + encodeURIComponent(process.env.VERCEL_TEAM_ID), { method: 'POST', headers: { authorization: 'Bearer ' + process.env.VERCEL_TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ name: 'liiiraa-boost-public-staging', project: process.env.PROJECT_ID, target: 'production', gitSource: { type: 'github', repoId: process.env.REPOSITORY_ID, ref: process.env.GIT_SHA }, env: { STAGING_API_ORIGIN: process.env.STAGING_API_ORIGIN } }) }); if (!response.ok) throw new Error('Vercel public deployment rejected: ' + response.status); appendFileSync(process.env.GITHUB_OUTPUT, 'origin=' + expected.origin + '\n');"

  deploy-account:
    name: Deploy isolated account staging project
    if: github.ref == 'refs/heads/main'
    needs: verify-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-account
    permissions:
      contents: read
    outputs:
      origin: ${{ steps.deploy.outputs.origin }}
    steps:
      - name: Request exact account project deployment
        id: deploy
        env:
          EXPECTED_ORIGIN: ${{ vars.ACCOUNT_STAGING_ORIGIN }}
          GIT_SHA: ${{ github.sha }}
          PROJECT_ID: ${{ secrets.VERCEL_ACCOUNT_PROJECT_ID }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          node --input-type=module --eval "import { appendFileSync } from 'node:fs'; const expected = new URL(process.env.EXPECTED_ORIGIN); if (expected.protocol !== 'https:' || expected.pathname !== '/' || expected.search || expected.hash) throw new Error('Invalid account staging origin'); const response = await fetch('https://api.vercel.com/v13/deployments?teamId=' + encodeURIComponent(process.env.VERCEL_TEAM_ID), { method: 'POST', headers: { authorization: 'Bearer ' + process.env.VERCEL_TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ name: 'liiiraa-boost-account-staging', project: process.env.PROJECT_ID, target: 'production', gitSource: { type: 'github', repoId: process.env.REPOSITORY_ID, ref: process.env.GIT_SHA }, env: { LIIIRAA_ACCOUNT_AUTHORITY_ORIGIN: process.env.STAGING_API_ORIGIN, LIIIRAA_ACCOUNT_PREVIEW: 'false', STAGING_API_ORIGIN: process.env.STAGING_API_ORIGIN } }) }); if (!response.ok) throw new Error('Vercel account deployment rejected: ' + response.status); appendFileSync(process.env.GITHUB_OUTPUT, 'origin=' + expected.origin + '\n');"

  deploy-admin:
    name: Deploy isolated admin staging project
    if: github.ref == 'refs/heads/main'
    needs: [verify-contracts, deploy-account]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-admin
    permissions:
      contents: read
    outputs:
      origin: ${{ steps.deploy.outputs.origin }}
    steps:
      - name: Request exact admin project deployment
        id: deploy
        env:
          EXPECTED_ORIGIN: ${{ vars.ADMIN_STAGING_ORIGIN }}
          ACCOUNT_ORIGIN: ${{ needs.deploy-account.outputs.origin }}
          GIT_SHA: ${{ github.sha }}
          PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          node --input-type=module --eval "import { appendFileSync } from 'node:fs'; const expected = new URL(process.env.EXPECTED_ORIGIN); const account = new URL(process.env.ACCOUNT_ORIGIN); if (expected.protocol !== 'https:' || expected.pathname !== '/' || expected.search || expected.hash) throw new Error('Invalid admin staging origin'); if (account.protocol !== 'https:' || account.origin !== process.env.ACCOUNT_ORIGIN || account.pathname !== '/' || account.search || account.hash) throw new Error('Invalid account staging origin'); const response = await fetch('https://api.vercel.com/v13/deployments?teamId=' + encodeURIComponent(process.env.VERCEL_TEAM_ID), { method: 'POST', headers: { authorization: 'Bearer ' + process.env.VERCEL_TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ name: 'liiiraa-boost-admin-staging', project: process.env.PROJECT_ID, target: 'production', gitSource: { type: 'github', repoId: process.env.REPOSITORY_ID, ref: process.env.GIT_SHA }, env: { LIIIRAA_ACCOUNT_ORIGIN: account.origin, LIIIRAA_ADMIN_AUTHORITY_ORIGIN: process.env.STAGING_API_ORIGIN, LIIIRAA_ADMIN_ORIGIN: expected.origin, LIIIRAA_ADMIN_PREVIEW: 'false', STAGING_API_ORIGIN: process.env.STAGING_API_ORIGIN } }) }); if (!response.ok) throw new Error('Vercel admin deployment rejected: ' + response.status); appendFileSync(process.env.GITHUB_OUTPUT, 'origin=' + expected.origin + '\n');"

  smoke-isolation:
    name: Probe origin, session, and consent isolation
    if: github.ref == 'refs/heads/main'
    needs: [deploy-public, deploy-account, deploy-admin]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-surfaces
    permissions:
      contents: read
    steps:
      - name: Check out exact deployed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Activate exact pnpm and install reviewed dependencies
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate && node tooling/supply-chain/verify-pins.mjs --check && pnpm install --frozen-lockfile --ignore-scripts
      - name: Run deployed fail-closed probes
        env:
          PUBLIC_STAGING_ORIGIN: ${{ needs.deploy-public.outputs.origin }}
          ACCOUNT_STAGING_ORIGIN: ${{ needs.deploy-account.outputs.origin }}
          ADMIN_STAGING_ORIGIN: ${{ needs.deploy-admin.outputs.origin }}
        run: pnpm --filter @liiiraa/web-evidence exec playwright test tests/security-artifacts.spec.ts --grep @staging-origin-live --workers=1

  broader-beta-promotion:
    name: Require owned identities before broader closed beta
    if: github.event_name == 'workflow_dispatch' && inputs.promotion_scope == 'broader-closed-beta'
    needs: smoke-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: broader-beta-promotion
    permissions:
      contents: read
    steps:
      - name: Reject provider URLs and incomplete callback or email identity
        env:
          OWNED_PUBLIC_ORIGIN: ${{ vars.OWNED_PUBLIC_ORIGIN }}
          OWNED_ACCOUNT_ORIGIN: ${{ vars.OWNED_ACCOUNT_ORIGIN }}
          OWNED_ADMIN_ORIGIN: ${{ vars.OWNED_ADMIN_ORIGIN }}
          OWNED_CALLBACK_ORIGINS: ${{ vars.OWNED_CALLBACK_ORIGINS }}
          OWNED_EMAIL_IDENTITY: ${{ vars.OWNED_EMAIL_IDENTITY }}
        run: >-
          node --input-type=module --eval "const values = Object.entries(process.env).filter(([key]) => key.startsWith('OWNED_')); if (values.some(([, value]) => !value)) throw new Error('Owned broader-beta identity is incomplete'); if (values.some(([, value]) => /(?:vercel\.app|onrender\.com|example\.(?:com|test))/iu.test(value))) throw new Error('Provider preview identity cannot pass broader-beta promotion'); for (const key of ['OWNED_PUBLIC_ORIGIN','OWNED_ACCOUNT_ORIGIN','OWNED_ADMIN_ORIGIN']) { const url = new URL(process.env[key]); if (url.protocol !== 'https:' || url.hostname.split('.').length < 3) throw new Error(key + ' is not an owned HTTPS origin'); }"
