name: Phase 4 staging API artifact

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Publish and verify the immutable image without deploying Render
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - packages/contracts-ts/**
      - packages/control-plane-*/**
      - pnpm-lock.yaml
      - .github/workflows/phase-4-staging-api.yml

permissions:
  contents: read

concurrency:
  group: phase-4-staging-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and publish immutable API digest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Activate exact pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Verify dependency allowlist before installation
        run: node tooling/supply-chain/verify-pins.mjs --check
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify contracts and focused staging policy
        env:
          POSTGRES_TEST_STRATEGY: unit
        run: >-
          pnpm contracts:compat &&
          pnpm --filter @liiiraa/api test -- --run staging-config &&
          pnpm --filter @liiiraa/api test -- --run container-contract &&
          pnpm --filter @liiiraa/api exec vitest --run src/staging/provision-stripe.test.ts src/staging/runtime-control-plane.test.ts &&
          pnpm --filter @liiiraa/api db:migrate:test
      - name: Configure BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Authenticate to GHCR for this job only
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build once and publish by digest with SBOM and provenance
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/liiiraa-boost-api,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
      - name: Require an immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: test "$(printf '%s' "$IMAGE_DIGEST" | grep -Ec '^sha256:[0-9a-f]{64}$')" -eq 1
      - name: Attest the exact published digest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/liiiraa-boost-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the exact published digest scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/liiiraa-boost-api@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln
          version: v0.73.0
      - name: Reject high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/liiiraa-boost-api@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          version: v0.73.0
      - name: Require anonymous pull access for staging hosting
        run: >-
          docker logout ghcr.io &&
          docker buildx imagetools inspect
          "ghcr.io/${{ github.repository_owner }}/liiiraa-boost-api@${{ steps.build.outputs.digest }}"
      - name: Upload bounded scan evidence
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-api-${{ github.sha }}-scan
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy tested digest to protected staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.build_only != true
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging-api
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out deployment contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Node.js for migration promotion
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Activate exact pnpm for migration promotion
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Verify dependency allowlist before migration installation
        run: node tooling/supply-chain/verify-pins.mjs --check
      - name: Install frozen migration dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require the tested digest and manual Render policy
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: >-
          test "$(printf '%s' "$IMAGE_DIGEST" | grep -Ec '^sha256:[0-9a-f]{64}$')" -eq 1 &&
          grep -F 'autoDeploy: false' apps/api/staging.render.yaml
      - name: Run staging migrations before promotion
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm --filter @liiiraa/api db:migrate
      - name: Provision isolated Stripe test catalog, Portal and signed webhook
        env:
          STAGING_API_ORIGIN: ${{ secrets.STAGING_API_ORIGIN }}
          STRIPE_PROVISION_ACTION: prepare
          STRIPE_RUNTIME_OUTPUT_PATH: ${{ runner.temp }}/liiiraa-stripe-runtime.json
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: pnpm --filter @liiiraa/api staging:provision-stripe
      - name: Update the bounded staging build identity
        env:
          ACCOUNT_STAGING_ORIGIN: ${{ vars.ACCOUNT_STAGING_ORIGIN }}
          ADMIN_STAGING_ORIGIN: ${{ vars.ADMIN_STAGING_ORIGIN }}
          AUDIT_ANCHOR_BUCKET: ${{ vars.AUDIT_ANCHOR_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DESKTOP_STAGING_ORIGIN: ${{ vars.DESKTOP_STAGING_ORIGIN }}
          PUBLIC_STAGING_ORIGIN: ${{ vars.PUBLIC_STAGING_ORIGIN }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          STAGING_API_ORIGIN: ${{ secrets.STAGING_API_ORIGIN }}
          STAGING_AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          STAGING_BUILD_ID: ${{ github.sha }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_RUNTIME_OUTPUT_PATH: ${{ runner.temp }}/liiiraa-stripe-runtime.json
          SUPPORT_BUCKET: ${{ vars.SUPPORT_BUCKET }}
        run: >-
          node --input-type=module --eval
          "import { readFileSync } from 'node:fs';
          const required = ['ACCOUNT_STAGING_ORIGIN','ADMIN_STAGING_ORIGIN','AUDIT_ANCHOR_BUCKET','AWS_REGION','DESKTOP_STAGING_ORIGIN','PUBLIC_STAGING_ORIGIN','STAGING_API_ORIGIN','STAGING_AUTH_SECRET','STAGING_BUILD_ID','STAGING_DATABASE_URL','STRIPE_SECRET_KEY','SUPPORT_BUCKET'];
          if (required.some((key) => !process.env[key])) throw new Error('Render staging authority environment is incomplete');
          const stripeRuntime = JSON.parse(readFileSync(process.env.STRIPE_RUNTIME_OUTPUT_PATH, 'utf8'));
          if (!/^whsec_[A-Za-z0-9_]+$/.test(stripeRuntime.webhookSecret)) throw new Error('Managed Stripe webhook secret is invalid');
          const fixed = { NODE_ENV: 'production', PORT: '3000', STAGING_CHANNEL: 'internal', STAGING_DATA_CLASSIFICATION: 'synthetic', STAGING_INVITATION_ONLY: 'true', STAGING_PUBLIC_SIGNUP: 'false' };
          process.stdout.write(JSON.stringify([...required.map((key) => ({ key, value: process.env[key] })), { key: 'STRIPE_WEBHOOK_SECRET', value: stripeRuntime.webhookSecret }, ...Object.entries(fixed).map(([key, value]) => ({ key, value }))]));" |
          curl --fail-with-body --silent --show-error
          --request PUT
          --header "Authorization: Bearer $RENDER_API_TOKEN"
          --header "Content-Type: application/json"
          --data-binary @-
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" > /dev/null
      - name: Deploy the tested GHCR digest only
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/liiiraa-boost-api@${{ needs.build.outputs.digest }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: >-
          curl --fail-with-body --silent --show-error
          --request PATCH
          --header "Authorization: Bearer $RENDER_API_TOKEN"
          --header "Content-Type: application/json"
          --data "{\"image\":{\"ownerId\":\"$RENDER_OWNER_ID\",\"imagePath\":\"$IMAGE_REF\"},\"autoDeploy\":\"no\"}"
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID"
      - name: Trigger the configured immutable digest deployment
        id: render-deploy
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/liiiraa-boost-api@${{ needs.build.outputs.digest }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"clearCache\":\"do_not_clear\",\"imageUrl\":\"$IMAGE_REF\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          deploy_id="$(node --input-type=module --eval \
            "const value = JSON.parse(process.argv[1]); if (!/^dep-[a-z0-9]+$/.test(value.id ?? '')) process.exit(1); process.stdout.write(value.id);" \
            "$response")"
          printf 'deploy_id=%s\n' "$deploy_id" >> "$GITHUB_OUTPUT"
          printf 'Triggered bounded Render deploy %s\n' "$deploy_id"
      - name: Verify hosted health and readiness
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          STAGING_API_ORIGIN: ${{ secrets.STAGING_API_ORIGIN }}
          STAGING_BUILD_ID: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            deploy="$(curl --fail --silent --show-error --max-time 15 \
              --header "Authorization: Bearer $RENDER_API_TOKEN" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID" || true)"
            deploy_status="$(node --input-type=module --eval \
              "try { const value = JSON.parse(process.argv[1]); process.stdout.write(value.status ?? 'unknown'); } catch { process.stdout.write('unknown'); }" \
              "$deploy")"
            ready="$(curl --fail --silent --show-error --max-time 15 "$STAGING_API_ORIGIN/ready" || true)"
            if [ "$deploy_status" = "live" ] &&
               printf '%s' "$ready" | grep -Fq "$STAGING_BUILD_ID" &&
               printf '%s' "$ready" | grep -Fq '"commerce-stripe-test"' &&
               printf '%s' "$ready" | grep -Fq '"device-authority"' &&
               printf '%s' "$ready" | grep -Fq '"support-consent-authority"'; then
              curl --fail-with-body --silent --show-error "$STAGING_API_ORIGIN/health"
              printf '%s\n' "$ready"
              exit 0
            fi
            if printf '%s' "$deploy_status" | grep -Eq '(failed|canceled)$'; then
              printf 'Render deploy entered terminal status: %s\n' "$deploy_status" >&2
              exit 1
            fi
            if [ $((attempt % 6)) -eq 0 ]; then
              printf 'Waiting for Render deploy %s (status: %s)\n' "$RENDER_DEPLOY_ID" "$deploy_status"
            fi
            sleep 10
          done
          echo "Timed out waiting for the tested staging build after 15 minutes" >&2
          exit 1
      - name: Emit bounded sanitized Render startup diagnostics
        if: failure()
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $RENDER_API_TOKEN" \
            --data-urlencode "ownerId=$RENDER_OWNER_ID" \
            --data-urlencode "resource=$RENDER_SERVICE_ID" \
            --data-urlencode "type=app" \
            --data-urlencode "direction=backward" \
            --data-urlencode "limit=20" \
            "https://api.render.com/v1/logs" |
          node --input-type=module --eval \
            "let input = ''; for await (const chunk of process.stdin) input += chunk; const matches = new Set(); const visit = (value) => { if (typeof value === 'string' && value.includes('STAGING_API_STARTUP_FAILED:')) matches.add(value); else if (Array.isArray(value)) value.forEach(visit); else if (value && typeof value === 'object') Object.values(value).forEach(visit); }; visit(JSON.parse(input)); const safe = [...matches].map((value) => value.replace(/postgres(?:ql)?:\\/\\/[^\\s]+/giu, '[REDACTED_DATABASE_URL]').replace(/(?:sk_(?:live|test)|whsec)_[A-Za-z0-9_]+/gu, '[REDACTED_PROVIDER_SECRET]').replace(/[\\r\\n]+/gu, ' ').slice(0, 320)); process.stdout.write(safe.length > 0 ? safe.join('\\n') + '\\n' : 'No sanitized startup diagnostic found in the last 20 Render app logs.\\n');"
      - name: Retire superseded managed Stripe staging webhooks
        env:
          STRIPE_PROVISION_ACTION: finalize
          STRIPE_RUNTIME_OUTPUT_PATH: ${{ runner.temp }}/liiiraa-stripe-runtime.json
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: pnpm --filter @liiiraa/api staging:provision-stripe
